_format_version: "3.0"

# Local declarative config used by docker-compose (DB-less mode).
consumers:
  - username: demo-consumer-app
    custom_id: qp-client-001
    keyauth_credentials:
      - key: demo-consumer-apikey
  - username: demo-consumer-app-2
    custom_id: qp-client-002
    keyauth_credentials:
      - key: demo-consumer-apikey-2

services:
  - name: qp-mask-service
    url: http://httpbin:80/anything
    routes:
      # Baseline route: header enabled + standard token/user masking.
      - name: qp-mask-route
        paths:
          - /mask
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log
              add_response_header: true
              response_header_name: X-Kong-QP-Log
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Same mask config, but header output intentionally disabled.
      - name: qp-mask-no-header-route
        paths:
          - /mask-no-header
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log_no_header
              add_response_header: false
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Plugin disabled path to validate no-op behavior.
      - name: qp-mask-plugin-disabled-route
        paths:
          - /mask-plugin-disabled
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              enabled: false
              error_format: default
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log_disabled
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Disabled
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Legacy config compatibility route using query_params + masks.
      - name: qp-mask-legacy-route
        paths:
          - /mask-legacy
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params: token,user
              separator: "|"
              output_field: qp_log_legacy
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Legacy
              masks:
                - regex: "(.{4}).+(.{2})"
                  replace: "$1***$2"
      # Invalid regex should be ignored safely, without failing request.
      - name: qp-mask-invalid-pattern-route
        paths:
          - /mask-invalid-pattern
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
              separator: "|"
              output_field: qp_log_invalid_pattern
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Invalid-Pattern
              query_params_log_mask:
                - pattern: "["
                  mask: "never_used"
      # Mask key omitted means replacement defaults to empty string.
      - name: qp-mask-empty-mask-route
        paths:
          - /mask-empty-mask
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
              separator: "|"
              output_field: qp_log_empty_mask
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Empty-Mask
              query_params_log_mask:
                - pattern: "xyz123"
      # Custom separator/header route for output formatting checks.
      - name: qp-mask-custom-format-route
        paths:
          - /mask-custom-format
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "||"
              output_field: qp_log_custom
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Custom
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Empty query list should produce no output even with header enabled.
      - name: qp-mask-empty-list-route
        paths:
          - /mask-empty-list
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log: []
              separator: "|"
              output_field: qp_log_empty_list
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Empty-List
      # Advanced route to validate ordered mask rules and edge cases.
      - name: qp-mask-advanced-route
        paths:
          - /mask-advanced
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - key1
                - qparam2
                - epqp1
                - epqparam2
                - password
              separator: "|"
              output_field: qp_log_advanced
              add_response_header: true
              response_header_name: X-Kong-QP-Log-Advanced
              query_params_log_mask:
                # Exact value replacement.
                - pattern: "xyz123"
                  mask: "mask_value"
                # Endpoint-specific marker replacement.
                - pattern: "ep_pattern"
                  mask: "mask_value_ep"
                # Hex-like payload masking.
                - pattern: "^(0x)?[a-fA-F0-9]+$"
                  mask: "mask_secret"
                # Generic long alphanumeric masking.
                - pattern: "^[A-Za-z0-9]{10,}$"
                  mask: "(masked)"
