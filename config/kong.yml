_format_version: "3.0"

# Local declarative config used by docker-compose (DB-less mode).
consumers:
  - username: demo-consumer-app
    custom_id: qp-client-001
    keyauth_credentials:
      - key: demo-consumer-apikey
  - username: demo-consumer-app-2
    custom_id: qp-client-002
    keyauth_credentials:
      - key: demo-consumer-apikey-2

services:
  - name: qp-mask-service
    url: http://httpbin:80/anything
    routes:
      # Baseline route: standard token/user masking into log serializer.
      - name: qp-mask-route
        paths:
          - /mask
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Alternate route using same behavior with a different output field.
      - name: qp-mask-no-header-route
        paths:
          - /mask-no-header
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log_no_header
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Plugin disabled path to validate no-op behavior.
      - name: qp-mask-plugin-disabled-route
        paths:
          - /mask-plugin-disabled
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              enabled: false
              query_params_to_log:
                - token
                - user
              separator: "|"
              output_field: qp_log_disabled
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Mask key omitted means replacement defaults to empty string.
      - name: qp-mask-empty-mask-route
        paths:
          - /mask-empty-mask
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
              separator: "|"
              output_field: qp_log_empty_mask
              query_params_log_mask:
                - pattern: "xyz123"
      # Custom separator route for output formatting checks.
      - name: qp-mask-custom-format-route
        paths:
          - /mask-custom-format
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - token
                - user
              separator: "||"
              output_field: qp_log_custom
              query_params_log_mask:
                - pattern: "(.{4}).+(.{2})"
                  mask: "$1***$2"
      # Empty query list should produce no output.
      - name: qp-mask-empty-list-route
        paths:
          - /mask-empty-list
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log: []
              separator: "|"
              output_field: qp_log_empty_list
      # Advanced route to validate ordered mask rules and edge cases.
      - name: qp-mask-advanced-route
        paths:
          - /mask-advanced
        plugins:
          - name: key-auth
            config:
              key_names:
                - apikey
              hide_credentials: true
          - name: qp-log-mask
            config:
              query_params_to_log:
                - key1
                - qparam2
                - epqp1
                - epqparam2
                - password
              separator: "|"
              output_field: qp_log_advanced
              query_params_log_mask:
                # Exact value replacement.
                - pattern: "xyz123"
                  mask: "mask_value"
                # Endpoint-specific marker replacement.
                - pattern: "ep_pattern"
                  mask: "mask_value_ep"
                # Hex-like payload masking.
                - pattern: "^(0x)?[a-fA-F0-9]+$"
                  mask: "mask_secret"
                # Generic long alphanumeric masking.
                - pattern: "^[A-Za-z0-9]{10,}$"
                  mask: "(masked)"
